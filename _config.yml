# ------------------------------------------------------------
#  Site settings — edit these first
# ------------------------------------------------------------
title: Saara Kaskivuo
description: >-
  Personal website of Saara Kaskivuo

# Your name as it appears in author lists. It will be highlighted
# on the Publications page. Add every variant you publish under.
author_names:
  - "Kaskivuo, S."
  - "S. Kaskivuo"
  - "Saara Kaskivuo"

# If the site is at https://<username>.github.io, leave baseurl empty.
# If it lives in a project repo (https://<username>.github.io/site), set baseurl: "/site"
url: ""
baseurl: ""

# Navigation (order matters)
nav:
  - title: Home
    url: /
  - title: Publications
    url: /publications/
  - title: Visuals
    url: /visuals/

# ------------------------------------------------------------
#  Build settings — no need to touch
# ------------------------------------------------------------
markdown: kramdown
permalink: pretty
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
